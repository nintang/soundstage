name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build SoundStage.app
        run: ./macos/make-app.sh

      - name: Zip app
        run: cd macos/build && ditto -c -k --keepParent SoundStage.app SoundStage.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundStage.app
          path: macos/build/SoundStage.app.zip

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/build/SoundStage.app.zip \
            --title "SoundStage $GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
          Built from source by GitHub Actions — see the run logs for provenance.

          **Install**
          1. Download `SoundStage.app.zip`, unzip, move to `/Applications`
          2. The app is not notarized — clear quarantine: `xattr -dr com.apple.quarantine /Applications/SoundStage.app` (or right-click → Open)
          3. Click the sliders icon in the menu bar → **Start** → allow *System Audio Recording*

          Requires macOS 14.4+ (Core Audio process-tap API), Apple Silicon.
          EOF
          )"
